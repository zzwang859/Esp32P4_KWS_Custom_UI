[project]
name = "esp32p4_kws_custom_ui"
version = "0.1.0"
description = "Lightweight pygame studio for keyword spotting audio collection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame>=2.6.1",
    "sounddevice>=0.5.2",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.139.2",
    "flask>=3.1.3",
    "gradio>=6.20.0",
    "librosa>=0.11,<0.12",
    "matplotlib>=3.11.1",
    "numba>=0.66.0",
    "numpy>=2.0,<3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pyroomacoustics>=0.10.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.13.0",
    "tensorboard>=2.21.0",
    "torch>=2.8,<2.9",
    "torchaudio>=2.8,<2.9",
    "PyYAML>=6.0",
    "onnx>=1.17,<1.18",
    "onnxruntime>=1.20,<1.21",
    "esp-ppq==1.3.11",
    "soundfile>=0.14,<0.15",
    "msvc-runtime>=14.44; sys_platform == 'win32'",
    "tqdm>=4.69.0",
    "hidapi>=0.14,<0.16",
]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
extra-index-url = ["https://mirrors.aliyun.com/pypi/simple"]

[tool.uv.sources]
esp-ppq = { path = "src/espdl_toolchain/common/packages/esp_ppq-1.3.11-py3-none-any.whl" }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
kws-studio = "kws_custom_ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
